
<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#071a17"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9c"/>
      <stop offset="50%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff9c" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- Cyber frame -->
  <rect x="18" y="18" width="1164" height="284"
        rx="14"
        fill="none"
        stroke="url(#neon)"
        stroke-width="2"
        opacity="0.8"/>

  <!-- Decorative lines -->
  <path d="M40 75 H250" stroke="#00ff9c" stroke-width="2" opacity="0.7"/>
  <path d="M950 245 H1160" stroke="#00d9ff" stroke-width="2" opacity="0.7"/>

  <!-- Wolf symbol -->
  <g transform="translate(105 85)" filter="url(#glow)">
    <path
      d="M75 8
         L112 38
         L142 28
         L132 70
         L151 112
         L112 102
         L75 132
         L38 102
         L0 112
         L19 70
         L9 28
         L39 38
         Z"
      fill="none"
      stroke="#00ff9c"
      stroke-width="5"
      stroke-linejoin="round"/>

    <path
      d="M39 70 L75 48 L112 70 L75 94 Z"
      fill="none"
      stroke="#00d9ff"
      stroke-width="4"/>

    <circle cx="52" cy="70" r="4" fill="#00ff9c"/>
    <circle cx="98" cy="70" r="4" fill="#00ff9c"/>
  </g>

  <!-- Terminal -->
  <g transform="translate(285 62)">
    <rect width="805" height="190" rx="12"
          fill="#05090d"
          stroke="#00ff9c"
          stroke-opacity="0.45"/>

    <circle cx="22" cy="22" r="5" fill="#00ff9c"/>
    <circle cx="40" cy="22" r="5" fill="#00d9ff"/>
    <circle cx="58" cy="22" r="5" fill="#8b5cf6"/>

    <text x="25" y="65"
          fill="#00ff9c"
          font-family="monospace"
          font-size="16">
      SYSTEM://WOLF-WMT
    </text>

    <text x="25" y="105"
          fill="#e6edf3"
          font-family="monospace"
          font-size="38"
          font-weight="bold">
      WOLF-WMT
    </text>

    <text x="28" y="137"
          fill="#00d9ff"
          font-family="monospace"
          font-size="17">
      CODE • SYSTEMS • SECURITY
    </text>

    <text x="28" y="168"
          fill="#8b949e"
          font-family="monospace"
          font-size="14">
      Python → Linux → C → Assembly → Cybersecurity
    </text>
  </g>

  <!-- Status -->
  <text x="1050" y="285"
        fill="#00ff9c"
        font-family="monospace"
        font-size="12">
    SYSTEM: ONLINE
  </text>
</svg>

